<!--
  The tab mark: the app bar's flask, the one that links home to /tools.

  It used to be the FlaskLoader's silhouette — a magenta-filled beaker — while
  the bar drew a cyan outlined flask, so the tab and the mark you press to get
  home were two different flasks. `SiteHeader`'s `FlaskGlyph` is the one that
  means "The Lab" while you are in it, so it is the one the tab wears; the
  loader stays what it is, a moving thing that means "wait".

  The glyph's two paths are copied verbatim from that component and placed by a
  transform rather than re-derived at 64 units, so a change to the bar's flask
  is a copy back into this file and never an arithmetic exercise. The scale is
  height-bound — the flask is a tall shape in a square tile, so 2.9 is what
  fills the plate vertically with the margin its rounded corners need, and the
  width follows. The stroke rides that scale untouched, which is why it is still
  the component's 1.6: proportionally identical is also 4.6 units here, well
  past the hairline that would round away to nothing on a 16px tab strip.

  Two things differ from the component on purpose. The liquid sits at 0.4
  against 0.28, since the bar tints against a lit metal face where this tints
  against near-black and the same opacity reads as empty glass; and the fill is
  painted *under* the outline rather than over it, so the one edge the eye has
  left to read at 16px stays the accent at full strength.

  The plate is the load-bearing part. Chrome's light tab strip is #dee1e6, and a
  transparent cyan-glass mark dissolves into it; the tile is what makes the mark
  read the same in both strips instead of only in the dark one.

  Colours are literal rather than tokens: an icon is fetched as a standalone
  document, so no stylesheet has registered the `active` custom property by the
  time it paints. #00ffe5 is that token's own value.

  Keep a double hyphen out of this comment. XML forbids one inside a comment, so
  spelling the custom property with its leading dashes fails the *whole file* to
  parse — and a browser's only symptom is the default globe icon coming back.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b1220" />

  <g transform="translate(-2.8 -2.8) scale(2.9)">
    <path
      d="M7.9 15.2h8.2l2.3 3.6a2 2 0 0 1-1.7 3H7.3a2 2 0 0 1-1.7-3l2.3-3.6Z"
      fill="#00ffe5"
      fill-opacity="0.4"
    />
    <path
      d="M10 3h4M10.75 3v6.2L5.6 17.4A2.4 2.4 0 0 0 7.6 21h8.8a2.4 2.4 0 0 0 2-3.6L13.25 9.2V3"
      fill="none"
      stroke="#00ffe5"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
